name: Build Versus Geode

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest

          - name: Android32
            os: ubuntu-latest
            target: Android32

          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Unpack Versus source
        shell: bash
        run: |
          rm -rf _versus_src
          mkdir -p _versus_src

          python -c "import zipfile; zipfile.ZipFile('Versus-Geode-v0.1.0-build-ready.zip').extractall('_versus_src')"

          echo "Extracted files:"
          find _versus_src -maxdepth 2 -type f -print

          ROOT="$(find _versus_src -mindepth 1 -maxdepth 1 -type d -print -quit)"

          if [ -z "$ROOT" ]; then
            echo "Could not find the Versus source folder."
            exit 1
          fi

          echo "Source root: $ROOT"

          cp -R "$ROOT"/. .

          echo "Project root:"
          ls -la

          if [ ! -f "mod.json" ]; then
            echo "mod.json was not found."
            exit 1
          fi

          if [ ! -f "CMakeLists.txt" ]; then
            echo "CMakeLists.txt was not found."
            exit 1
          fi

      - name: Build Versus
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package Windows + Android
    runs-on: ubuntu-latest
    needs:
      - build

    steps:
      - name: Combine builds
        uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - name: Upload Versus .geode
        uses: actions/upload-artifact@v7
        with:
          name: Versus-Geode
          path: ${{ steps.build.outputs.build-output }}

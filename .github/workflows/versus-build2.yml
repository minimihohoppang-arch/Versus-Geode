name: Build Versus Geode 2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Unpack Versus source
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import os
          import shutil
          import zipfile

          files = sorted(glob.glob("Versus-Geode-v0.1.0-build-ready*.zip"))
          assert files, "Versus ZIP not found"

          zip_path = files[-1]
          print("Using:", zip_path)

          shutil.rmtree("_versus_src", ignore_errors=True)
          os.makedirs("_versus_src", exist_ok=True)

          with zipfile.ZipFile(zip_path) as z:
              z.extractall("_versus_src")

          mods = glob.glob("_versus_src/**/mod.json", recursive=True)
          assert mods, "mod.json not found"

          root = os.path.dirname(mods[0])
          print("Project root:", root)

          for item in os.listdir(root):
              src = os.path.join(root, item)
              dst = os.path.join(".", item)

              if os.path.isdir(src):
                  shutil.copytree(src, dst, dirs_exist_ok=True)
              else:
                  shutil.copy2(src, dst)

          assert os.path.isfile("mod.json")
          assert os.path.isfile("CMakeLists.txt")
          PY

      - name: Build Versus
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package Windows + Android
    runs-on: ubuntu-latest
    needs:
      - build

    steps:
      - name: Combine builds
        uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - name: Upload Versus
        uses: actions/upload-artifact@v7
        with:
          name: Versus-Geode
          path: ${{ steps.build.outputs.build-output }}

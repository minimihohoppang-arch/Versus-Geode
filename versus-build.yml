name: Build Versus Geode

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Unpack Versus source
        shell: bash
        run: |
          rm -rf _versus_src
          mkdir -p _versus_src
          python -m zipfile -e Versus-Geode-v0.1.0-build-ready.zip _versus_src
          cp -R _versus_src/Versus-Geode-v0.1.0/. .

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package Windows + Android
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v7
        with:
          name: Versus-Geode
          path: ${{ steps.build.outputs.build-output }}

      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          OUTPUT="${{ steps.build.outputs.build-output }}"
          FILE=$(find "$OUTPUT" -type f -name '*.geode' | head -n 1)
          if [ -z "$FILE" ]; then
            echo "No .geode file was produced"
            exit 1
          fi
          gh release delete v0.1.0-build --yes --cleanup-tag || true
          gh release create v0.1.0-build "$FILE#k2qr.versus.geode" \
            --title "Versus v0.1.0 Build" \
            --notes "Automatic Windows + Android test build."
